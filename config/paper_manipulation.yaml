# Robotic Paper Manipulation Sequence Configuration
# Coordinates format: [x, y, z, rx, ry, rz]

locations:
  pen_dock: [-0.3, -0.4, 0.2, 0.0, 3.14, 0.0]
  magnet_1_start: [-0.4, -0.5, 0.2, 0.0, 3.14, 0.0]
  magnet_1_temp: [-0.5, -0.5, 0.2, 0.0, 3.14, 0.0]
  magnet_2_start: [-0.6, -0.5, 0.2, 0.0, 3.14, 0.0]
  magnet_2_temp: [-0.7, -0.5, 0.2, 0.0, 3.14, 0.0]
  paper_grab: [-0.5, -0.6, 0.2, 0.0, 3.14, 0.0]
  cut_trajectory: [-0.5, -0.7, 0.2, 0.0, 3.14, 0.0]
  handover_target: [-0.2, -0.7, 0.3, 0.0, 3.14, 0.0]
