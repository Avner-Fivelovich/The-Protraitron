  paper_pull_end: [-0.5, -0.6, 0.2, 0.0, 3.14, 0.0]

speeds:
  default_move: 0.1     # General robotic movement speed
  cut_pull: 0.3         # Faster speed for tearing the paper cleanly against the edge
